      :root {
        --bg: #f4f7fb;
        --sheet: #ffffff;
        --grid: #dbe6f3;
        --ink: #123a6b;
        --text: #1b2a3d;
        --muted: #50627c;
        --line: #123a6b;
        --hl: #e8612c;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #123d73;
          --sheet: #15467f;
          --grid: #2a5a92;
          --ink: #e9f2ff;
          --text: #e9f2ff;
          --muted: #b3c9e6;
          --line: #cfe0f7;
          --hl: #ffb070;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #123d73;
        --sheet: #15467f;
        --grid: #2a5a92;
        --ink: #e9f2ff;
        --text: #e9f2ff;
        --muted: #b3c9e6;
        --line: #cfe0f7;
        --hl: #ffb070;
        color-scheme: dark;
      }
      body {
        background-color: var(--bg);
        background-image:
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 24px 24px;
        color: var(--text);
        font-family: "Barlow", system-ui, sans-serif;
        font-size: 1.05rem;
        line-height: 1.6;
      }
      .wrap {
        max-width: 1140px;
        margin: 0 auto;
        padding: 56px 24px 70px;
      }
      h1 {
        font-family: "Share Tech Mono", monospace;
        font-weight: 400;
        color: var(--ink);
        font-size: clamp(2rem, 5vw, 3.2rem);
        line-height: 1.05;
        margin: 0 0 10px;
      }
      .intro {
        color: var(--muted);
        max-width: 62ch;
        margin: 0 0 24px;
        font-size: 1.1rem;
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0 0 30px;
      }
      .filters button {
        font-family: "Share Tech Mono", monospace;
        background: var(--sheet);
        color: var(--ink);
        border: 1.5px solid var(--line);
        padding: 4px 12px;
        cursor: pointer;
      }
      .filters button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--sheet);
      }
      .sheets {
        display: grid;
        gap: 28px;
      }
      .sheet {
        background: var(--sheet);
        border: 2px solid var(--line);
        position: relative;
        display: grid;
        grid-template-columns: 230px 1fr;
        box-shadow: 6px 6px 0 color-mix(in srgb, var(--line) 20%, transparent);
      }
      .sheet[hidden] {
        display: none;
      }
      .draw {
        border-right: 2px solid var(--line);
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .draw svg {
        width: 100%;
        height: auto;
        display: block;
      }
      .draw svg * {
        fill: none;
        stroke: var(--ink);
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .draw svg .acc {
        stroke: var(--hl);
      }
      .draw svg .dash {
        stroke-dasharray: 4 4;
        opacity: 0.6;
      }
      .tb {
        display: grid;
        grid-template-columns: auto 1fr;
        border: 1.5px solid var(--line);
        font-family: "Share Tech Mono", monospace;
        font-size: 0.78rem;
      }
      .tb span {
        padding: 3px 7px;
        border-bottom: 1px solid var(--line);
      }
      .tb span:nth-child(odd) {
        border-right: 1px solid var(--line);
        color: var(--muted);
      }
      .tb span:nth-last-child(-n + 2) {
        border-bottom: 0;
      }
      .body {
        padding: 20px 24px 22px;
      }
      .body h2 {
        font-family: "Share Tech Mono", monospace;
        font-weight: 400;
        color: var(--ink);
        font-size: 1.8rem;
        margin: 0;
        line-height: 1.1;
      }
      .body .kind {
        margin: 2px 0 14px;
        color: var(--muted);
      }
      .cols {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px 28px;
      }
      .lbl {
        font-family: "Share Tech Mono", monospace;
        color: var(--hl);
        font-size: 0.85rem;
        margin: 0 0 4px;
      }
      .cols p {
        margin: 0 0 12px;
      }
      .feat {
        margin: 4px 0 14px;
        padding: 0;
        list-style: none;
      }
      .feat li {
        padding: 5px 0 5px 22px;
        position: relative;
        border-bottom: 1px dashed var(--grid);
      }
      .feat li::before {
        content: "";
        position: absolute;
        left: 2px;
        top: 13px;
        width: 9px;
        height: 9px;
        border: 1.5px solid var(--hl);
        transform: rotate(45deg);
      }
      .stack {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .stack li {
        font-family: "Share Tech Mono", monospace;
        font-size: 0.8rem;
        border: 1px solid var(--line);
        color: var(--ink);
        padding: 1px 7px;
      }
      .link {
        display: inline-block;
        margin-top: 14px;
        font-family: "Share Tech Mono", monospace;
        color: var(--ink);
        border: 1.5px solid var(--line);
        padding: 4px 12px;
        text-decoration: none;
      }
      .link:hover {
        background: var(--ink);
        color: var(--sheet);
      }
      .shots {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .shots figure {
        margin: 0;
      }
      .shot {
        display: block;
        width: 100%;
        padding: 0;
        border: 1.5px solid var(--line);
        background: none;
        cursor: zoom-in;
      }
      .shot img {
        width: 100%;
        aspect-ratio: 2/1;
        object-fit: cover;
        object-position: top left;
      }
      .shots figcaption {
        font-size: 0.85rem;
        color: var(--muted);
        margin-top: 6px;
        line-height: 1.4;
      }
      @media (max-width: 640px) {
        .shots {
          grid-template-columns: 1fr;
        }
      }
      dialog {
        border: 0;
        padding: 0;
        background: transparent;
        max-width: 96vw;
      }
      dialog::backdrop {
        background: rgba(8, 20, 40, 0.88);
      }
      dialog img {
        max-width: 94vw;
        max-height: 80vh;
        border: 2px solid #cfe0f7;
      }
      dialog p {
        color: #e9f2ff;
        margin: 10px 0 0;
        text-align: center;
      }
      dialog button {
        position: fixed;
        top: 14px;
        right: 14px;
        background: #e9f2ff;
        color: #123a6b;
        border: 0;
        padding: 6px 14px;
        cursor: pointer;
        font-family: "Share Tech Mono", monospace;
      }
      .sheet > * {
        min-width: 0;
      }
      .tb span {
        overflow-wrap: anywhere;
      }
      .body h2,
      .body .kind {
        overflow-wrap: anywhere;
      }
      @media (max-width: 420px) {
        .draw svg {
          width: 84px !important;
        }
        .draw {
          gap: 8px;
          padding: 12px;
        }
        .body {
          padding: 16px 16px 18px;
        }
      }
      @media (max-width: 820px) {
        .sheet {
          grid-template-columns: 1fr;
        }
        .draw {
          border-right: 0;
          border-bottom: 2px solid var(--line);

          align-items: center;

        .draw svg {
          width: 120px;

          color: #123a6b;
          border: 0;
          padding: 6px 14px;
          cursor: pointer;
          font-family: "Share Tech Mono", monospace;
        }
      }
    </style>
  </head>
